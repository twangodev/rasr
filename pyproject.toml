[project]
name = "radiotalk-asr"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=4.8.5",
    "jiwer>=3.1.0",
    "numpy>=2.4.5",
    "omegaconf>=2.3.0",
    "pydantic>=2.13.4",
    "radiotalk",
    "rich>=15.0.0",
    "soundfile>=0.13.1",
    "typer>=0.25.1",
]

[project.scripts]
rasr = "rasr.cli:app"

[project.optional-dependencies]
whisper = [
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "torchcodec>=0.12.0",
    "transformers>=5.8.1",
]
qwen-asr = [
    "qwen-asr>=0.0.6",
]
cohere-asr = [
    "accelerate>=1.12.0",
    "librosa>=0.11.0",
    "sentencepiece>=0.2.1",
    "torch>=2.12.0",
    "transformers>=4.57.6",
]
granite-speech = [
    "peft>=0.19.1",
    "torch>=2.12.0",
    "transformers>=4.57.6",
]
parakeet = [
    "nemo-toolkit[asr]>=2.7",
]
mega-asr = [
    # Mega-ASR (Qwen3-ASR-1.7B + audio-quality router LoRA) is vendored via the `third_party/Mega-ASR` submodule since upstream has no Python packaging.
    "qwen-asr>=0.0.6",
    "safetensors>=0.4",
    "scipy>=1.11",
    "torch>=2.10",
    "torchaudio>=2.10",
    "torchcodec>=0.12.0",
    "librosa>=0.11.0",
]
voxtral = [
    "accelerate>=1.12.0",
    "librosa>=0.11.0",
    "mistral-common>=1.6.0",
    "soundfile>=0.13.1",
    "torch>=2.12.0",
    "torchcodec>=0.12.0",
    "transformers>=4.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rasr"]

[tool.uv]
# Linux-only — nemo-toolkit (parakeet) doesn't build cleanly on win32 and
# darwin lacks CUDA, so restricting here narrows the fork space the resolver
# has to satisfy on every change.
environments = ["sys_platform == 'linux'"]
# Sibling-repo / transitive constraint mismatches force-resolved at the project
# level:
# - qwen-asr 0.0.6 hard-pins accelerate==1.12.0 but radiotalk requires
#   >=1.13.0. qwen-asr's pin is stricter than its actual API surface needs.
# - nemo-toolkit (parakeet) wants protobuf>=5.29.5; descript-audio-codec
#   (transitive via radiotalk → snac) wants <3.20. protobuf 5.x is wire-level
#   backwards-compatible with 3.x; force-pin up.
override-dependencies = [
    "accelerate>=1.13.0",
    "protobuf>=5.29.5",
]
conflicts = [
    [{ extra = "whisper" }, { extra = "qwen-asr" }],
    [{ extra = "whisper" }, { extra = "parakeet" }],
    [{ extra = "qwen-asr" }, { extra = "parakeet" }],
    [{ extra = "cohere-asr" }, { extra = "parakeet" }],
    [{ extra = "granite-speech" }, { extra = "parakeet" }],
    [{ extra = "whisper" }, { extra = "mega-asr" }],
    [{ extra = "mega-asr" }, { extra = "parakeet" }],
    [{ extra = "voxtral" }, { extra = "parakeet" }],
]

[tool.uv.sources]
radiotalk = { path = "../radiotalk", editable = true }
