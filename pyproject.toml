[project]
name = "radiotalk-asr"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=4.8.5",
    "jiwer>=4.0.0",
    "numpy>=2.4.5",
    "pydantic>=2.13.4",
    "radiotalk",
    "rich>=15.0.0",
    "soundfile>=0.13.1",
    "typer>=0.25.1",
]

[project.scripts]
rasr = "rasr.cli:app"

[project.optional-dependencies]
whisper = [
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "torchcodec>=0.12.0",
    "transformers>=5.8.1",
]
qwen-asr = [
    "qwen-asr>=0.0.6",
]
cohere-asr = [
    "accelerate>=1.12.0",
    "librosa>=0.11.0",
    "sentencepiece>=0.2.1",
    "torch>=2.12.0",
    "transformers>=4.57.6",
]
granite-speech = [
    "peft>=0.19.1",
    "torch>=2.12.0",
    "transformers>=4.57.6",
]
parakeet = [
    "nemo-toolkit[asr]>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rasr"]

[tool.uv]
conflicts = [
    [{ extra = "whisper" }, { extra = "qwen-asr" }],
]

[tool.uv.sources]
radiotalk = { path = "../radiotalk", editable = true }
