[project]
name = "radiotalk-asr"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jiwer>=4.0.0",
    "numpy>=2.4.5",
    "pydantic>=2.13.4",
    "radiotalk",
    "rich>=15.0.0",
    "soundfile>=0.13.1",
    "typer>=0.25.1",
]

[project.scripts]
rasr = "rasr.cli:app"

[project.optional-dependencies]
whisper = [
    "torch>=2.12.0",
    "transformers>=5.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rasr"]

[tool.uv.sources]
radiotalk = { path = "../radiotalk", editable = true }
