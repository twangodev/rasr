# Base recipe for the Higgs lr/warmup sweep. NOT a full run on its own:
# scripts/sweep_higgs.sh drives this with per-trial CLI overrides
# (optimizer.lr, scheduler.warmup_steps, output.dir). Short 2k-step trials on
# a shared 40k-clip dump (cached once, keyed on dataset+limit) so each trial
# only re-reads WAVs. save_top_k=1 so the best ATCO2 val WER lands in the
# checkpoint filename, which the sweep script parses then deletes.

defaults: [base, rtx6kpro/hw]

name: parakeet-higgs-sweep

model:
  scheme: parakeet
  ref: nvidia/parakeet-tdt-0.6b-v3

data:
  train:
    - dataset: hf:twangodev/radiotalk-us-audio-higgs-noisy:train
      weight: 1.0
      limit: 60000
  validation:
    - dataset: hf:jlvdoorn/atco2-asr:validation

trainer:
  max_steps: 3000
  val_check_interval: 500

output:
  dir: ckpt/higgs-sweep/_base
  save_top_k: 1
