# Continued NEST SSL pretraining of parakeet-tdt-0.6b-v3's encoder on unlabeled
# TartanAviation (real US ATC VHF). See docs/data-tartanaviation.md for obtaining
# the corpus (~505 GB MinIO download; not on HF) and docs/superpowers/specs/
# 2026-05-26-ssl-continued-pretraining-design.md for the design.
#
# Inherits base + rtx6kpro/hw for optimizer/scheduler/trainer(batch_size,precision,
# num_workers,etc.)/output defaults and data.audio. SSLTrainConfig declares only
# name/ssl/audio/optimizer/scheduler/trainer/output, so the inherited data:/
# augmentation: blocks are ignored by Pydantic; load_ssl_train_config maps the
# inherited data.audio onto the top-level `audio` block.
defaults: [base, rtx6kpro/hw]
name: parakeet-ssl-tartan
ssl:
  source: local:/data/tartanaviation/audio/**/*.wav   # update to your download path
  min_db: -20.0
  init_encoder_from: nvidia/parakeet-tdt-0.6b-v3
  # TartanAviation recordings are multi-minute continuous ATC channels (~95% dead
  # air). Energy-VAD split each into utterance chunks before SSL.
  segment: true
  segment_top_db: 40.0
  segment_min_s: 0.5
  segment_max_s: 30.0
# Override the inherited 18s cap so 30s segment chunks pass the dataloader's
# duration filter (load_ssl_train_config maps data.audio -> top-level audio).
data:
  audio:
    max_duration: 30.0
    min_duration: 0.5
trainer:
  max_steps: 20000
  val_check_interval: 2000
output:
  dir: ckpt/${name}
